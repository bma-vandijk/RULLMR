<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <script>
    (function () {
      var theme = "light";
      try {
        if (localStorage.getItem("rullmr-theme") === "dark") theme = "dark";
      } catch (e) { }
      var root = document.documentElement;
      root.setAttribute("data-theme", theme);
      root.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.setAttribute("content", theme);
    })();
  </script>
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  {%- feed_meta -%}
</head>

<body>
  <a class="skip-link" href="#content">Skip to content</a>
  {%- include header.html -%}
  <main id="content" class="page-content" aria-label="Content">
    <div class="wrapper{% if page.wide %} wrapper-wide{% endif %}">
      {{ content }}
    </div>
  </main>
  {%- include footer.html -%}
  <script src="{{ '/assets/js/accordion.js' | relative_url }}" defer></script>
</body>

</html>
