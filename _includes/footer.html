<footer class="site-footer">
  <div class="wrapper wrapper-wide footer-inner">
    <div>
      <p class="footer-title">{{ site.title }}</p>
      <p class="footer-copy">{{ site.tagline }}<br>{{ site.institution }} · {{ site.department }}</p>
    </div>
    <div class="footer-meta">
      <p>{{ site.credits }} · {{ site.duration }}</p>
      <p>
        <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a>
      </p>
    </div>
  </div>
</footer>
